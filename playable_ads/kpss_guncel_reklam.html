<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KPSS Hazırlık — Güncel Bilgiler</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(120% 90% at 50% 0%, #241a3d 0%, #0f0d17 60%);color:#efe9f7;overflow:hidden}
  #app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:18px 16px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
  .brand .logo{font-size:22px}
  .pill{margin-left:auto;font-size:11px;background:#8b5cf633;border:1px solid #8b5cf6;
    color:#c9b8ff;padding:4px 10px;border-radius:999px;font-weight:700}
  .top{margin-top:14px}
  .prog{height:6px;background:#ffffff1a;border-radius:999px;overflow:hidden;margin:14px 0}
  .prog > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8b5cf6,#ec4899);
    border-radius:999px;transition:width .35s ease}
  .q{background:#ffffff0d;border:1px solid #ffffff1f;border-radius:16px;padding:16px;
    font-size:17px;font-weight:700;line-height:1.4;min-height:78px;display:flex;align-items:center}
  .opts{margin-top:12px;display:flex;flex-direction:column;gap:10px;flex:1}
  .opt{background:#ffffff10;border:1.5px solid #ffffff24;border-radius:14px;padding:14px 16px;
    font-size:15px;font-weight:700;color:#efe9f7;text-align:left;transition:.15s;cursor:pointer}
  .opt:active{transform:scale(.98)}
  .opt.correct{background:#22c55e29;border-color:#22c55e;color:#c8f7d6}
  .opt.wrong{background:#ef444429;border-color:#ef4444;color:#ffd5d5}
  .opt.dim{opacity:.5}
  .score{font-size:12px;color:#b8b0c8;text-align:center;margin-top:8px}
  /* Bitiş ekranı */
  #end{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
  #end .big{font-size:40px}
  #end h2{font-size:22px;font-weight:900}
  #end p{color:#b8b0c8;font-size:14px;line-height:1.5;max-width:320px}
  .cta{margin-top:6px;width:100%;max-width:340px}
  .btn{display:block;width:100%;background:linear-gradient(90deg,#8b5cf6,#ec4899);color:#fff;
    border:none;border-radius:16px;padding:16px;font-size:17px;font-weight:900;cursor:pointer;
    box-shadow:0 10px 26px #8b5cf655;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
  .foot{text-align:center;font-size:11px;color:#7d7594;padding-top:10px}
  .install-hint{font-size:12px;color:#c9b8ff;margin-top:2px}
</style>
</head>
<body>
<div id="app">
  <div class="brand"><span class="logo">📚</span> KPSS Hazırlık
    <span class="pill">Güncel Bilgiler</span></div>

  <!-- Oyun -->
  <div id="game" class="top" style="display:flex;flex-direction:column;flex:1">
    <div class="prog"><i id="bar"></i></div>
    <div id="q" class="q"></div>
    <div id="opts" class="opts"></div>
    <div id="score" class="score"></div>
  </div>

  <!-- Bitiş / CTA -->
  <div id="end">
    <div class="big">🏆</div>
    <h2 id="endTitle">Harika gidiyorsun!</h2>
    <p>Bu, KPSS Hazırlık uygulamasındaki <b>16.000+ sorudan</b> yalnızca birkaçıydı. Konu anlatımları, deneme sınavları, düello ve oyunların tamamı uygulamada — <b>ücretsiz</b>.</p>
    <div class="cta">
      <button class="btn" onclick="installClick()">Ücretsiz İndir ▸</button>
      <div class="install-hint">App Store'da KPSS Hazırlık: Soru Bankası</div>
    </div>
  </div>

  <div class="foot" onclick="installClick()">KPSS Hazırlık: Soru Bankası • Dokun ve indir</div>
</div>

<script>
/* ── Reklam ağı "yükle/CTA" köprüsü — AdMob(mraid) / Google Ads(ExitApi) /
   Meta(FbPlayableAd) hepsi denenir; olmazsa doğrudan mağaza linki. ── */
var STORE_URL = 'https://apps.apple.com/app/id0000000000'; /* TODO: gerçek App Store linki */
function installClick(){
  try{ if(window.mraid && mraid.open){ mraid.open(STORE_URL); return; } }catch(e){}
  try{ if(window.ExitApi && ExitApi.exit){ ExitApi.exit(); return; } }catch(e){}
  try{ if(window.FbPlayableAd && FbPlayableAd.onCTAClick){ FbPlayableAd.onCTAClick(); return; } }catch(e){}
  try{ window.open(STORE_URL,'_blank'); }catch(e){}
}

var QS = [
  {q:"6 Şubat 2023 depremlerinin merkez üssü hangi ildir?",
   o:["Adıyaman","Malatya","Kahramanmaraş","Gaziantep"], a:2},
  {q:"Türkiye Cumhuriyeti'nin 100. yılı hangi tarihte kutlandı?",
   o:["23 Nisan 2023","29 Ekim 2023","30 Ağustos 2023","19 Mayıs 2023"], a:1},
  {q:"Türkiye'de toplam il sayısı kaçtır?",
   o:["79","80","81","82"], a:2},
  {q:"Türkiye'de kaç büyükşehir belediyesi vardır?",
   o:["26","30","34","40"], a:1},
  {q:"Türkiye Varlık Fonu hangi yıl kurulmuştur?",
   o:["2014","2015","2016","2018"], a:2}
];

var i=0, correct=0, locked=false;
var qEl=document.getElementById('q'), optsEl=document.getElementById('opts'),
    barEl=document.getElementById('bar'), scoreEl=document.getElementById('score');

function render(){
  var item=QS[i];
  qEl.textContent=item.q;
  optsEl.innerHTML='';
  item.o.forEach(function(txt,idx){
    var b=document.createElement('button');
    b.className='opt'; b.textContent=txt;
    b.onclick=function(){ pick(idx,item.a,b); };
    optsEl.appendChild(b);
  });
  barEl.style.width=((i)/QS.length*100)+'%';
  scoreEl.textContent='Soru '+(i+1)+' / '+QS.length+'   •   Doğru: '+correct;
}

function pick(idx,ans,btn){
  if(locked) return; locked=true;
  var kids=optsEl.children;
  for(var k=0;k<kids.length;k++){ kids[k].onclick=null; if(k!==idx&&k!==ans) kids[k].classList.add('dim'); }
  if(idx===ans){ btn.classList.add('correct'); correct++; }
  else{ btn.classList.add('wrong'); kids[ans].classList.add('correct'); }
  scoreEl.textContent='Doğru: '+correct;
  setTimeout(function(){
    i++; locked=false;
    if(i>=QS.length){ finish(); } else { render(); }
  }, 850);
}

function finish(){
  barEl.style.width='100%';
  document.getElementById('game').style.display='none';
  var end=document.getElementById('end'); end.style.display='flex';
  document.getElementById('endTitle').textContent =
    correct>=4 ? 'Süpersin! '+correct+'/'+QS.length+' doğru' : 'İyi başlangıç!';
}

render();
</script>
</body>
</html>
